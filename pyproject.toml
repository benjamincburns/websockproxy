[project]
name = "websockproxy"
version = "0.2.0"
description = "An Ethernet-over-WebSocket relay for emulators that run in a web browser, such as jor1k and v86."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14.0,<17",
    "python-pytun>=2.2.1,<3; sys_platform == 'linux'",
]

[project.optional-dependencies]
abuse = ["dnspython>=2.6,<3"]

[project.scripts]
websockproxy = "websockproxy.switchedrelay:main"
websockproxy-blocklist = "websockproxy.blocklist:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websockproxy"]

[dependency-groups]
dev = [
    "dnspython>=2.6,<3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "scapy>=2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
