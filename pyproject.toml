[project]
name = "websockproxy"
version = "0.1.0"
description = "A virtual ethernet switch for browser-based VMs (e.g. jor1k, v86, etc). Transmits ethernet frames via websocket."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14.0,<17",
    "python-pytun>=2.2.1,<3; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websockproxy"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "scapy>=2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
